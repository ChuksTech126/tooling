<VirtualHost *:80>
    ServerAdmin infra@chuksapp.online

    DocumentRoot /var/www/html/html

    <Directory /var/www/html/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
